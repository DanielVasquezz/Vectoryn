name: PR Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx mock certifi
          pip install -r ingestion/requirements.txt
          pip install -r search/requirements.txt
          # torch CPU-only: install from PyTorch index to get the smaller wheel.
          # This matches what worker/requirements.txt declares (torch>=2.2.0).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r worker/requirements.txt

      - name: Lint with Ruff
        run: ruff check ingestion/ worker/ search/

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          PYTHONPATH: .
          TESTING: "true"
          GROQ_API_KEY: "mock_key_for_ci"
          VECTORYN_API_KEY: "test-key-ci"
          QDRANT_HOST: "localhost"
          QDRANT_PORT: "6333"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
        run: |
          pytest tests/unit/ \
            --cov=ingestion \
            --cov=search \
            --cov=worker \
            --cov-report=xml \
            -v --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
