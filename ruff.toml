# Vectoryn — Ruff Configuration
# line-length 120 is standard in modern enterprise projects (Google, Meta, Stripe)
line-length = 120

[lint]
select = ["E", "W", "F"]
ignore = [
    "E501",  # line too long — handled by line-length = 120
    "E402",  # module-level import not at top — intentional (load_dotenv before imports)
    "F841",  # local variable assigned but never used — removed in code fixes below
]

[lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F811"]
