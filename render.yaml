# render.yaml — Vectoryn deployment on Render
# Docs: https://render.com/docs/blueprint-spec
#
# VARIABLES REQUERIDAS (sync: false = debes setearlas manualmente en el dashboard):
# ┌─────────────────────────┬──────────────────────────────────────────────────┐
# │ Variable                │ Dónde conseguirla                                │
# ├─────────────────────────┼──────────────────────────────────────────────────┤
# │ KAFKA_BOOTSTRAP_SERVERS │ Aiven Console → Kafka → Overview → Host:Port     │
# │ KAFKA_CA_CERT           │ Aiven Console → Kafka → Overview → Download CA   │
# │ KAFKA_ACCESS_CERT       │ Aiven Console → Kafka → Overview → Access Cert   │
# │ KAFKA_ACCESS_KEY        │ Aiven Console → Kafka → Overview → Access Key    │
# │ QDRANT_URL              │ Qdrant Cloud → Cluster → URL                     │
# │ QDRANT_API_KEY          │ Qdrant Cloud → Cluster → API Key                 │
# │ GROQ_API_KEY            │ console.groq.com → API Keys                      │
# │ VECTORYN_API_KEY        │ Cualquier string seguro (tú lo inventas)         │
# └─────────────────────────┴──────────────────────────────────────────────────┘

services:

  # ── INGESTION API ─────────────────────────────────────────
  - type: web
    name: vectoryn-ingestion
    runtime: docker
    dockerfilePath: ./ingestion/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Kafka → Aiven Cloud (mTLS) ──────────────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_ACCESS_CERT
        sync: false
      - key: KAFKA_ACCESS_KEY
        sync: false
      # Fallback SASL (solo si NO usas mTLS)
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_INGEST
        value: raw-documents
      - key: KAFKA_TOPIC_FAILED
        value: documents-failed
      # ── Qdrant Cloud ─────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents
      # ── App ──────────────────────────────────────────────
      - key: VECTORYN_API_KEY
        sync: false
      - key: ENABLE_PII_SHIELD
        value: "true"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""

  # ── SEARCH API ────────────────────────────────────────────
  - type: web
    name: vectoryn-search
    runtime: docker
    dockerfilePath: ./search/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Qdrant Cloud ─────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents
      # ── LLM (Groq) ───────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # ── App ──────────────────────────────────────────────
      - key: VECTORYN_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ENABLE_SPARSE
        value: "false"
      - key: ENABLE_RERANKER
        value: "false"
      - key: ENABLE_RAGAS_EVAL
        value: "false"
      - key: ENABLE_QUERY_EXPANSION
        value: "true"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""

  # ── GATEWAY ───────────────────────────────────────────────
  - type: web
    name: vectoryn-gateway
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # ⚠️ URLs completas con https:// — fromService.property:host no incluye el scheme
      - key: INGESTION_SERVICE_URL
        value: "https://vectoryn-ingestion.onrender.com"
      - key: SEARCH_SERVICE_URL
        value: "https://vectoryn-search.onrender.com"
      - key: VECTORYN_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""

  # ── WORKER ────────────────────────────────────────────────
  - type: web
    name: vectoryn-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Kafka → Aiven Cloud (mTLS) ──────────────────────
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: KAFKA_ACCESS_CERT
        sync: false
      - key: KAFKA_ACCESS_KEY
        sync: false
      # Fallback SASL (solo si NO usas mTLS)
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_TOPIC_INGEST
        value: raw-documents
      - key: KAFKA_TOPIC_FAILED
        value: documents-failed
      - key: KAFKA_GROUP_ID
        value: embedding-cluster-v4
      # ── Qdrant Cloud ─────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: documents
      # ── Worker config ────────────────────────────────────
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ENABLE_SPARSE
        value: "false"
      - key: WORKER_BATCH_SIZE
        value: "1"
      - key: WORKER_BATCH_TIMEOUT_MS
        value: "2000"
      - key: WORKER_HEALTH_PORT
        value: "8002"
      - key: WORKER_MAX_DOC_CHARS
        value: "50000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: ENABLE_PROMETHEUS
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""
